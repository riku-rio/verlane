[project]
name = "verlane"
version = "0.0.1"
description = "A local-first agentic coding runtime."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.16.0",
]

[project.scripts]
verlane = "verlane.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verlane"]
